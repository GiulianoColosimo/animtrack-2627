project:
  type: website
  output-dir: docs          # GitHub Pages serves from /docs on the main branch
  execute-dir: project      # every chunk runs at the project root, so `data/...` always works
  render:
    - "*.qmd"
    - "classes/**/*.qmd"
    - "!README.md"
  resources:
    - .nojekyll             # tells GitHub Pages to serve docs/ as-is, without Jekyll

execute:
  freeze: auto              # cache R results; CI/Pages never needs to run R
  warning: false
  message: false

website:
  title: "Animal Tracking"
  site-url: https://giulianocolosimo.github.io/animtrack-2627/
  repo-url: https://github.com/GiulianoColosimo/animtrack-2627
  repo-actions: [issue]
  reader-mode: true
  page-navigation: true
  description: "Animal tracking in conservation biology — MSc Biologia Ambientale, University of Rome Tor Vergata (2026-2027)."
  open-graph:
    locale: en_US

  navbar:
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Calendar"
        href: calendar.qmd
      - text: "Syllabus"
        href: syllabus.qmd
      - text: "Setup"
        href: setup.qmd
      - text: "Data"
        href: data.qmd
      - text: "Resources"
        href: resources.qmd

  sidebar:
    logo: "./assets/figures/avatar.jpg"
    pinned: false
    align: center
    style: "docked"
    background: light
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - text: "Calendar"
        href: calendar.qmd
      - text: "Syllabus"
        href: syllabus.qmd
      - text: "Software setup"
        href: setup.qmd
      - text: "Datasets"
        href: data.qmd
      - section: "Sessions"
        contents:
          - section: "1 · Foundations"
            contents:
              - text: "Slides — Why animals move, how we watch them"
                href: classes/class-01/slides.qmd
              - text: "Practical"
                href: classes/class-01/exercise.qmd
          - section: "2 · Spatial data in R"
            contents:
              - text: "Slides — The survival kit"
                href: classes/class-02/slides.qmd
              - text: "Practical"
                href: classes/class-02/exercise.qmd
          - section: "3 · From fixes to trajectories"
            contents:
              - text: "Slides — Cleaning, bursts, resampling"
                href: classes/class-03/slides.qmd
              - text: "Practical"
                href: classes/class-03/exercise.qmd
          - section: "4 · Quantifying movement"
            contents:
              - text: "Slides — Path descriptors, behaviour"
                href: classes/class-04/slides.qmd
              - text: "Practical"
                href: classes/class-04/exercise.qmd
          - section: "5 · Movement models"
            contents:
              - text: "Slides — Random walks and simulation"
                href: classes/class-05/slides.qmd
              - text: "Practical"
                href: classes/class-05/exercise.qmd
          - section: "6 · Home ranges"
            contents:
              - text: "Slides — MCP → KDE → BBMM → AKDE"
                href: classes/class-06/slides.qmd
              - text: "Practical"
                href: classes/class-06/exercise.qmd
          - section: "7 · Habitat selection"
            contents:
              - text: "Slides — RSF and SSF"
                href: classes/class-07/slides.qmd
              - text: "Practical"
                href: classes/class-07/exercise.qmd
          - section: "8 · Hidden Markov models"
            contents:
              - text: "Slides — States, frontier, synthesis"
                href: classes/class-08/slides.qmd
              - text: "Practical"
                href: classes/class-08/exercise.qmd
      - text: "Resources"
        href: resources.qmd

    tools:
      - icon: github
        url: "https://github.com/GiulianoColosimo/animtrack-2627"
      - icon: envelope
        url: "mailto:giuliano.colosimo@uniroma2.it"

  page-footer:
    left: "© 2026 Giuliano Colosimo — CC BY-NC-SA 4.0"
    right: "Built with [Quarto](https://quarto.org/)."
    background: dark

csl: apa_5th_edition.csl

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [cosmo, assets/theme-dark.scss]
    mainfont: "Atkinson Hyperlegible"
    css: assets/quiz.css
    include-after-body: assets/quiz.html
    code-copy: true
    code-overflow: wrap
    code-link: true
    toc: true
    link-external-newwindow: true
